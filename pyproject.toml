[project]
name = "lunarnav"
version = "0.1.0"
description = "Lunar Landing Site Navigator - NASA Space Apps Challenge 2026"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "numpy",
    "scipy",
    "pandas",
    "pyarrow",
    "rasterio",
    "pyproj",
    "skyfield",
    "spiceypy",
    "requests",
    "streamlit",
    "plotly",
]

[dependency-groups]
dev = [
    "matplotlib>=3.11.2",
    "pytest",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/lunarnav"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["--strict-markers"]
markers = [
    "network: test needs internet access (JPL Horizons, PGDA)",
    "slow: test takes more than a few seconds",
]
